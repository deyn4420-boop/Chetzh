services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Two app instances - this is the whole point of the Redis pub/sub bridge.
  # A message from a user connected to app1 must reach a user connected to
  # app2. Without Redis, it wouldn't.
  app1:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    expose:
      - "8000"

  app2:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2

volumes:
  pgdata:
